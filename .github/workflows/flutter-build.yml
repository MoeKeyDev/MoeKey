name: 正式发布Flutter应用

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-build:
    name: 校验发布版本
    runs-on: ubuntu-latest
    outputs:
      APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
      BUILD_NAME: ${{ steps.version.outputs.BUILD_NAME }}
      BUILD_NUMBER: ${{ steps.version.outputs.BUILD_NUMBER }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 校验 tag、版本号和更新记录
        id: version
        run: python3 scripts/prepare_release.py
      - name: 保存发布说明
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
  build-apk:
    name: 编译android
    runs-on: ubuntu-latest
    needs: [ pre-build ]
    steps:
      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装依赖项
        run: flutter pub get

      - name: 设置java环境
        uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: "21"

      - name: 运行代码生成器
        run: dart run build_runner build

      - name: 初始化签名
        run: |
          touch ./android/key.properties
          echo keyPassword='${{ secrets.KEYPASSWORD }}' >> ./android/key.properties
          echo storePassword='${{ secrets.STOREPASSWORD }}' >> ./android/key.properties
          echo keyAlias='${{ secrets.KEYALIAS }}' >> ./android/key.properties
          echo storeFile='./key.jks' >> ./android/key.properties
          echo ${{ secrets.KEY_STORE }} | base64 --decode > ./android/app/key.jks
      - name: 编译apk
        run: flutter build apk --build-name=${{ needs.pre-build.outputs.BUILD_NAME }} --build-number=${{ needs.pre-build.outputs.BUILD_NUMBER }} --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols/release

      - name: 上传apk到工作流程
        uses: actions/upload-artifact@v4
        with:
          name: build-apk
          path: build/app/outputs/apk/release/*

  build-linux:
    name: 编译linux
    runs-on: ubuntu-latest
    needs: [ pre-build ]
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: 安装ninja、libgtk
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv

      - name: 安装依赖项
        run: flutter pub get

      - name: 配置桌面
        run: flutter config --enable-linux-desktop

      - name: 运行代码生成器
        run: dart run build_runner build

      - name: 编译linux
        run: flutter build linux --build-name=${{ needs.pre-build.outputs.BUILD_NAME }} --build-number=${{ needs.pre-build.outputs.BUILD_NUMBER }}

      - name: 压缩生成的文件
        run: tar -zcvf "MoeKey-${{ needs.pre-build.outputs.APP_VERSION }}-linux-x86_64-release.tar.gz" --directory=build/linux/x64/release/bundle .

      - name: 上传到工作流程
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: "MoeKey-${{ needs.pre-build.outputs.APP_VERSION }}-linux-x86_64-release.tar.gz"

  build-windows:
    name: 编译windows
    runs-on: windows-latest
    needs: [ pre-build ]
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: 安装依赖项
        run: flutter pub get

      - name: 启动windows桌面
        run: flutter config --enable-windows-desktop

      - name: 运行代码生成器
        run: dart run build_runner build

      - name: 编译windows
        run: flutter build windows --build-name=${{ needs.pre-build.outputs.BUILD_NAME }} --build-number=${{ needs.pre-build.outputs.BUILD_NUMBER }}

      - name: 压缩生成的文件
        run: |
          $sourceFolder = "build\windows\x64\runner\Release"
          $destinationPath = "MoeKey-${{ needs.pre-build.outputs.APP_VERSION }}-windows-x86_64-release.zip"
          Compress-Archive -Path $sourceFolder -DestinationPath $destinationPath

      - name: 上传到工作流程
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: "MoeKey-${{ needs.pre-build.outputs.APP_VERSION }}-windows-x86_64-release.zip"

  build-macos:
    name: 编译macOS
    runs-on: macos-latest
    needs: [ pre-build ]
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: 安装依赖项
        run: flutter pub get

      - name: 启动桌面
        run: flutter config --enable-macos-desktop

      - name: 运行代码生成器
        run: dart run build_runner build

      - name: 编译macOS
        run: flutter build macos --build-name=${{ needs.pre-build.outputs.BUILD_NAME }} --build-number=${{ needs.pre-build.outputs.BUILD_NUMBER }}

      - name: 压缩生成的文件
        run: |
          cd build/macos/Build/Products/Release
          zip -rq MoeKey-${{ needs.pre-build.outputs.APP_VERSION }}-macOS-universal-release.zip MoeKey.app
          mv MoeKey-${{ needs.pre-build.outputs.APP_VERSION }}-macOS-universal-release.zip $GITHUB_WORKSPACE

      - name: 上传到工作流程
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: |
            MoeKey-${{ needs.pre-build.outputs.APP_VERSION }}-macOS-universal-release.zip

  build-ios:
    name: 编译iOS
    runs-on: macos-latest
    needs: [ pre-build ]
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: 安装依赖项
        run: flutter pub get

      - name: 运行代码生成器
        run: dart run build_runner build

      - name: 编译iOS
        run: flutter build ios --build-name=${{ needs.pre-build.outputs.BUILD_NAME }} --build-number=${{ needs.pre-build.outputs.BUILD_NUMBER }} --release --no-codesign
      
      - name: Copy Runner.app
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload

      - name: Create IPA (Unsigned)
        run: |
          zip -r MoeKey-${{ needs.pre-build.outputs.APP_VERSION }}-iOS-release.ipa Payload

      - name: 上传到工作流程
        uses: actions/upload-artifact@v4
        with:
          name: build-ios
          path: |
            MoeKey-${{ needs.pre-build.outputs.APP_VERSION }}-iOS-release.ipa

  release:
    name: 上传包
    needs: [ build-apk, build-linux, build-windows, build-macos, build-ios, pre-build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载发布说明
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      - name: 下载apk
        uses: actions/download-artifact@v4
        with:
          name: build-apk
          path: artifact

      - name: 下载linux
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: artifact

      - name: 下载windows
        uses: actions/download-artifact@v4
        with:
          name: build-windows
          path: artifact

      - name: 下载macOS
        uses: actions/download-artifact@v4
        with:
          name: build-macos
          path: artifact

      - name: 下载iOS
        uses: actions/download-artifact@v4
        with:
          name: build-ios
          path: artifact

      - name: 创建releases
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.pre-build.outputs.APP_VERSION }}
          files: ./artifact/*
          body_path: notes/release-notes.md
          fail_on_unmatched_files: true
